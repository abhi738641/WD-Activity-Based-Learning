<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Shopping Store</title>
    <link rel="stylesheet" href="style2.css">
</head>
<body>
    <header>
        <h1>ShopEase</h1>
        <div class="nav-bar">
            <a href="#">Home</a>
            <a href="#">Products</a>
            <a href="#">Categories</a>
            <a href="#">Cart (0)</a>
        </div>
    </header>
    <div class="banner">
        <h2>Special Discount: Get 20% Off on All Electronics!</h2>
    </div>
    <main class="product-grid">
        <div class="product-card">
            <h3>Wireless Headphones</h3>
            <p class="price">$49.99 <span class="discount">20% OFF</span></p>
            <p class="rating">Rating: ★★★★☆</p>
            <button>Add to Cart</button>
        </div>
        <div class="product-card">
            <h3>Smart Watch</h3>
            <p class="price">$89.99 <span class="discount">15% OFF</span></p>
            <p class="rating">Rating: ★★★★★</p>
            <button>Add to Cart</button>
        </div>
        <div class="product-card">
            <h3>Running Shoes</h3>
            <p class="price">$59.99 <span class="discount">10% OFF</span></p>
            <p class="rating">Rating: ★★★★☆</p>
            <button>Add to Cart</button>
        </div>
    </main>
    <footer>
        <p>&copy; 2026 ShopEase. All rights reserved.</p>
    </footer>
</body>
</html>
